name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Engine tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Dashboard route tests
        run: |
          python -m pip install --quiet fastapi httpx
          python -m unittest tests.test_dashboard_api -v
